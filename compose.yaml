services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interactive_story
      POSTGRES_USER: story
      POSTGRES_PASSWORD: story_dev_password
    ports:
      - "5432:5432"
    volumes:
      - interactive_story_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d interactive_story"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - interactive_story_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/interactive-story;
      mc anonymous set download local/interactive-story;
      "

volumes:
  interactive_story_postgres:
  interactive_story_minio:
